name: Release

# Push a version tag (e.g. v1.0.0) to build the app and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained single-file exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish MarantzController.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=$version `
            -o publish
          Move-Item publish/MarantzController.exe "MarantzController-${{ github.ref_name }}-win-x64.exe"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "MarantzController-${{ github.ref_name }}-win-x64.exe" `
            --title "Marantz Controller ${{ github.ref_name }}" `
            --notes-file .github/release-notes.md
